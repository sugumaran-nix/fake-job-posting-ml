version: "3.9"

services:
  web:
    build: .
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:?Set FLASK_SECRET_KEY in .env}
      - FLASK_ENV=${FLASK_ENV:-production}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - RATELIMIT_STORAGE_URI=${RATELIMIT_STORAGE_URI:-memory://}
    volumes:
      # Persist dataset, trained models, and DB outside the container
      - ./data:/app/data
      - ./models:/app/models
      - ./static/images:/app/static/images
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    # NOTE: Keep workers=1. In-process model cache is per-worker.
    # To scale: use a load balancer + shared Redis for rate limiting.
    command: >
      sh -c "gunicorn -w 1 -b 0.0.0.0:${PORT:-5000}
             --timeout 120 --access-logfile - app:app"
