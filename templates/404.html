{% extends "base.html" %}
{% block title %}404 — Not Found · JobGuard{% endblock %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-6 text-center">
  <div>
    <div class="font-disp font-extrabold text-[8rem] leading-none text-border mb-4 tracking-tight select-none">404</div>
    <h1 class="font-disp font-bold text-2xl text-t1 mb-3">Page not found</h1>
    <p class="font-mono text-xs text-t3 mb-8 max-w-xs mx-auto">
      The page you're looking for doesn't exist or has been moved.
    </p>
    <div class="flex justify-center gap-3 flex-wrap">
      <a href="{{ url_for('home') }}" class="btn-primary text-sm">
        <i class="fa-solid fa-house text-xs"></i> Go Home
      </a>
      <a href="{{ url_for('classify') }}" class="btn-ghost text-sm">
        <i class="fa-solid fa-magnifying-glass text-xs"></i> Analyse a Job
      </a>
    </div>
  </div>
</div>
{% endblock %}
