{% extends "base.html" %}
{% block title %}404 — Page Not Found · JobGuard{% endblock %}
{% block content %}
<section class="section error-page">
  <div class="tc">
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-sub">The page you're looking for doesn't exist or has been moved.</p>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <a href="{{ url_for('home') }}"     class="btn btn-primary btn-lg"><i class="fa-solid fa-house"></i> Go Home</a>
      <a href="{{ url_for('classify') }}" class="btn btn-ghost btn-lg"><i class="fa-solid fa-magnifying-glass"></i> Analyse a Job</a>
    </div>
  </div>
</section>
{% endblock %}
