{% extends "base.html" %}
{% block title %}404 — Not Found · JobGuard{% endblock %}
{% block content %}
<div style="min-height:60vh;display:flex;align-items:center;justify-content:center;padding:40px 24px;text-align:center;">
  <div>
    <p style="font-size:96px;font-weight:700;color:var(--surface-3);line-height:1;margin-bottom:16px;letter-spacing:-0.04em;user-select:none;" aria-hidden="true">404</p>
    <h1 style="font-size:18px;font-weight:600;color:var(--t1);margin-bottom:8px;">Page not found</h1>
    <p style="font-size:14px;color:var(--t3);margin-bottom:28px;max-width:260px;margin-inline:auto;line-height:1.6;">
      The page you're looking for doesn't exist or has been moved.
    </p>
    <div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;">
      <a href="{{ url_for('home') }}" class="btn btn-primary">
        <i class="fa-solid fa-house" aria-hidden="true" style="font-size:12px;"></i> Home
      </a>
      <a href="{{ url_for('classify') }}" class="btn btn-secondary">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true" style="font-size:12px;"></i>
        Check a posting
      </a>
    </div>
  </div>
</div>
{% endblock %}
