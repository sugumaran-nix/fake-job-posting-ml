{% extends "base.html" %}
{% block title %}500 — Server Error · JobGuard{% endblock %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-6 text-center">
  <div>
    <div class="font-display font-bold text-[8rem] leading-none text-gray-800 mb-4 tracking-tight select-none">500</div>
    <h1 class="font-display font-bold text-2xl text-white mb-3">Something Went Wrong</h1>
    <p class="text-gray-400 text-sm mb-8 max-w-xs mx-auto">An unexpected server error occurred. Try again or return home.</p>
    <div class="flex justify-center gap-3 flex-wrap">
      <a href="{{ url_for('home') }}"
         class="inline-flex items-center gap-2 px-6 py-3 bg-blue-600 hover:bg-blue-500
                text-white font-semibold text-sm rounded-xl transition-all">
        <i class="fa-solid fa-house text-xs"></i> Go Home
      </a>
      <a href="{{ url_for('classify') }}"
         class="inline-flex items-center gap-2 px-6 py-3 bg-gray-800 hover:bg-gray-700
                border border-gray-700 text-gray-300 font-semibold text-sm rounded-xl transition-all">
        <i class="fa-solid fa-rotate text-xs"></i> Try Again
      </a>
    </div>
  </div>
</div>
{% endblock %}
