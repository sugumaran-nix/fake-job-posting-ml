{% extends "base.html" %}
{% block title %}500 — Server Error · JobGuard{% endblock %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-6 text-center">
  <div>
    <div class="font-disp font-extrabold text-[8rem] leading-none text-border mb-4 tracking-tight select-none">500</div>
    <h1 class="font-disp font-bold text-2xl text-t1 mb-3">Something went wrong</h1>
    <p class="font-mono text-xs text-t3 mb-8 max-w-xs mx-auto">
      An unexpected server error occurred. Try again or return home.
    </p>
    <div class="flex justify-center gap-3 flex-wrap">
      <a href="{{ url_for('home') }}" class="btn-primary text-sm">
        <i class="fa-solid fa-house text-xs"></i> Go Home
      </a>
      <a href="{{ url_for('classify') }}" class="btn-ghost text-sm">
        <i class="fa-solid fa-rotate text-xs"></i> Try Again
      </a>
    </div>
  </div>
</div>
{% endblock %}
