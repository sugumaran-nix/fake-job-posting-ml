{% extends "base.html" %}
{% block title %}500 — Server Error · JobGuard{% endblock %}
{% block content %}
<div class="min-h-[60vh] flex items-center justify-center px-5 text-center">
  <div>
    <p class="font-data text-[80px] font-medium text-b3 leading-none mb-4 tracking-tight select-none">500</p>
    <h1 class="text-base font-semibold text-t1 mb-2">Something went wrong</h1>
    <p class="font-data text-[11px] text-t3 mb-6 max-w-[240px] mx-auto leading-relaxed">
      An unexpected server error occurred. Try again or return home.
    </p>
    <div class="flex justify-center gap-2 flex-wrap">
      <a href="{{ url_for('home') }}" class="btn btn-primary text-xs">
        <i class="fa-solid fa-house text-[10px]"></i>Home
      </a>
      <a href="{{ url_for('classify') }}" class="btn btn-secondary text-xs">
        <i class="fa-solid fa-rotate text-[10px]"></i>Try again
      </a>
    </div>
  </div>
</div>
{% endblock %}
